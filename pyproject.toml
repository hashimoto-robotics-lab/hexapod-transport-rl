[project]
name = "hexapod-transport-rl"
version = "0.1.0"
description = "Cooperative hexapod pushing in MuJoCo with shared-policy MAPPO"
requires-python = ">=3.12,<3.14"
dependencies = [
    "mujoco==3.11.0",
    "numpy>=2.0,<2.5",
    "torch>=2.7,<3",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
    "gymnasium>=1.2,<2",
    "matplotlib>=3.9,<4",
    "mediapy>=1.2,<2",
    "pandas>=2.2,<4",
]

[project.scripts]
hexapod-transport = "hexapod_transport_rl.cli:main"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hexapod_transport_rl"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "nbformat>=5.10", "nbclient>=0.10", "ipykernel>=6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
