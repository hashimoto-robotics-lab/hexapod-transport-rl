[project]
name = "hexapod-transport-rl"
version = "0.1.0"
description = "Student API for single-hexapod cylinder pushing with TorchRL PPO"
requires-python = ">=3.12,<3.14"
dependencies = [
    "mujoco==3.11.0",
    "numpy>=2.0,<2.5",
    "torch>=2.7,<3",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
    "gymnasium>=1.2,<2",
    "torchrl==0.14.0",
    "tensordict==0.14.2",
]

[project.optional-dependencies]
warp = ["mujoco-warp==3.11.0", "warp-lang==1.15.0"]
notebook = ["matplotlib>=3.9,<4", "pandas>=2.2,<4", "ipython>=7.34,<10"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hexapod_transport_rl"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "nbformat>=5.10", "nbclient>=0.10", "ipykernel>=6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
